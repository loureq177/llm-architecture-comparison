[project]
name = "llm-architecture-comparison"
version = "0.1.0"
description = "Transformer, MDLM, Mamba and DeltaBlock language models on FineWeb-Edu"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fla-core>=0.6.0",
    "huggingface-hub>=1.24.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pyarrow>=26.0.0",
    "torch>=2.12.1",
    "trackio==0.45.0",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
mamba = ["mamba-ssm", "ninja"]

[tool.uv.extra-build-dependencies]
mamba-ssm = [{ requirement = "torch", match-runtime = true }, "setuptools"]
